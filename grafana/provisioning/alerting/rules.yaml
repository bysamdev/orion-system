apiVersion: 1

groups:
  # ══════════════════════════════════════════════════════════════
  # Grupo 1: Agentes Orion (Windows/Linux endpoints monitorados)
  # ══════════════════════════════════════════════════════════════
  - orgId: 1
    name: orion-agent-alerts
    folder: Orion
    interval: 1m
    rules:
      - uid: orion-agent-offline
        title: Agente Offline
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: 'up{job="orion_agents"}'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: C
        for: 5m
        labels:
          severity: critical
          team: infra
        annotations:
          summary: "{{ $labels.hostname }} está offline há mais de 5 minutos"
          description: "O agente Orion não responde. Verificar conectividade, firewall ou se o serviço está rodando."

      - uid: orion-cpu-alto-sustentado
        title: CPU Alto Sustentado
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: 'orion_cpu_usage_percent'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [90] }
              refId: C
        for: 10m
        labels:
          severity: warning
          team: infra
        annotations:
          summary: "{{ $labels.hostname }} com CPU acima de 90% por mais de 10 minutos"
          description: "Verificar processos em execução. Possível carga anormal ou malware."

      - uid: orion-disco-cheio-em-breve
        title: Disco Ficará Cheio em Breve
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: '(orion_disk_total_bytes - orion_disk_used_bytes) / clamp_min(deriv(orion_disk_used_bytes[6h]), 1e-9) / 86400'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [7] }
              refId: C
        for: 15m
        labels:
          severity: warning
          team: infra
        annotations:
          summary: "{{ $labels.hostname }} vai encher o disco em menos de 7 dias"
          description: "Ação necessária: limpar logs, arquivos temporários ou expandir disco."

      - uid: orion-antivirus-desativado
        title: Antivírus Desativado
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: 'max by (hostname) (orion_security_antivirus_status)'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: C
        for: 5m
        labels:
          severity: critical
          team: security
        annotations:
          summary: "Nenhum antivírus ativo em {{ $labels.hostname }}"

      - uid: orion-firewall-desativado
        title: Firewall Desativado
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: 'orion_security_firewall_status'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: C
        for: 5m
        labels:
          severity: critical
          team: security
        annotations:
          summary: "Firewall desativado em {{ $labels.hostname }}"

      - uid: orion-windows-nao-ativado
        title: Windows Não Ativado
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: 'orion_windows_activation_status'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: C
        for: 15m
        labels:
          severity: warning
          team: infra
        annotations:
          summary: "Licença do Windows não ativada em {{ $labels.hostname }}"

  # ══════════════════════════════════════════════════════════════
  # Grupo 2: Host Debian Server (Node Exporter)
  # ══════════════════════════════════════════════════════════════
  - orgId: 1
    name: debian-host-alerts
    folder: Orion
    interval: 1m
    rules:
      - uid: debian-host-offline
        title: Servidor Debian Offline
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: 'up{job="node"}'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: C
        for: 2m
        labels:
          severity: critical
          team: infra
        annotations:
          summary: "Servidor Debian (debian-server) está offline"
          description: "Node Exporter parou de responder. Verificar se o servidor está ligado e acessível."

      - uid: debian-disco-85pct
        title: Disco do Servidor > 85%
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: '100 - ((node_filesystem_avail_bytes{job="node",mountpoint="/",fstype!="tmpfs"} / node_filesystem_size_bytes{job="node",mountpoint="/",fstype!="tmpfs"}) * 100)'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [85] }
              refId: C
        for: 5m
        labels:
          severity: warning
          team: infra
        annotations:
          summary: "Disco raiz do servidor Debian acima de 85%"
          description: "Uso atual: {{ $value | printf \"%.1f\" }}%. Limpar logs e arquivos antigos."

      - uid: debian-ram-90pct
        title: RAM do Servidor > 90%
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: '100 - ((node_memory_MemAvailable_bytes{job="node"} / node_memory_MemTotal_bytes{job="node"}) * 100)'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [90] }
              refId: C
        for: 5m
        labels:
          severity: warning
          team: infra
        annotations:
          summary: "Memória RAM do servidor Debian acima de 90%"
          description: "Uso atual: {{ $value | printf \"%.1f\" }}%. Verificar containers com consumo excessivo."

      - uid: debian-cpu-85pct
        title: CPU do Servidor > 85%
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: '100 - (avg by(instance) (rate(node_cpu_seconds_total{job="node",mode="idle"}[5m])) * 100)'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [85] }
              refId: C
        for: 5m
        labels:
          severity: warning
          team: infra
        annotations:
          summary: "CPU do servidor Debian sustentada acima de 85%"
          description: "Uso atual: {{ $value | printf \"%.1f\" }}%. Verificar processo causador com 'top' ou 'htop'."

  # ══════════════════════════════════════════════════════════════
  # Grupo 3: Disponibilidade Web & Rede (Blackbox Exporter)
  # ══════════════════════════════════════════════════════════════
  - orgId: 1
    name: blackbox-alerts
    folder: Orion
    interval: 1m
    rules:
      - uid: site-fora-do-ar
        title: Site / Endpoint Fora do Ar
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: 'probe_success{job="blackbox_http"}'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: C
        for: 1m
        labels:
          severity: critical
          team: infra
        annotations:
          summary: "Site {{ $labels.instance }} está OFFLINE"
          description: "O endpoint não respondeu com sucesso. Verificar servidor web, DNS e certificado SSL."

      - uid: ssl-expirando
        title: Certificado SSL Expirando em Breve
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: '(probe_ssl_earliest_cert_expiry{job="blackbox_http"} - time()) / 86400'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [14] }
              refId: C
        for: 1h
        labels:
          severity: warning
          team: infra
        annotations:
          summary: "Certificado SSL de {{ $labels.instance }} expira em menos de 14 dias"
          description: "Dias restantes: {{ $value | printf \"%.0f\" }}. Renovar certificado SSL urgente."

  # ══════════════════════════════════════════════════════════════
  # Grupo 4: Containers Docker (cAdvisor)
  # ══════════════════════════════════════════════════════════════
  - orgId: 1
    name: container-alerts
    folder: Orion
    interval: 1m
    rules:
      - uid: container-reiniciando-loop
        title: Container em Loop de Reinicialização
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: 'increase(container_last_seen{job="docker",image!=""}[5m])'
              instant: true
              refId: A
          - refId: B
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: PBFA97CFB590B2093
            model:
              expr: 'time() - container_last_seen{job="docker",image!=""}'
              instant: true
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [120] }
              refId: C
        for: 3m
        labels:
          severity: warning
          team: infra
        annotations:
          summary: "Container {{ $labels.name }} pode estar em crash/restart loop"
          description: "Container parou de reportar métricas por mais de 2 minutos. Verificar logs com 'docker logs'."

  # ══════════════════════════════════════════════════════════════
  # Grupo: Tetos do plano Supabase
  #
  # Sem estas regras, o primeiro sinal de que um teto foi atingido é o
  # sistema já degradado — banco em somente-leitura ou conexão recusada,
  # com todo o parque parando de reportar ao mesmo tempo. O disparo em 80%
  # existe pra dar margem de manobra (migrar de plano, limpar dados) antes
  # disso.
  #
  # Fonte: GET https://orion.bysam.dev/api/monitoring/capacity, autenticado
  # com GRAFANA_WEBHOOK_SECRET (datasource orion-api). O intervalo é de 15
  # minutos porque nenhum destes números se move em escala de segundos, e a
  # consulta custa uma ida ao Postgres.
  #
  # Egress e mensagens de Realtime NÃO estão cobertos aqui: só a Management
  # API do Supabase os conhece, e ela exige um token de conta que o Orion
  # não tem. Enquanto isso, esses dois continuam sendo acompanhados à mão no
  # painel de billing.
  # ══════════════════════════════════════════════════════════════
  - orgId: 1
    name: orion-supabase-capacity
    folder: Orion
    interval: 15m
    rules:
      - uid: orion-supabase-banco-cheio
        title: Banco Supabase Perto do Limite
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: orion-api
            model:
              refId: A
              type: json
              source: url
              format: table
              parser: backend
              url: https://orion.bysam.dev/api/monitoring/capacity
              url_options: { method: GET }
              root_selector: ""
              columns:
                - selector: banco_pct
                  text: banco_pct
                  type: number
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [80] }
              refId: C
        for: 15m
        labels:
          severity: critical
          team: infra
        annotations:
          summary: "Banco Supabase em {{ $values.A }}% do limite do plano"
          description: "Ao chegar em 100% o projeto entra em somente-leitura e TODAS as máquinas param de reportar. Liberar espaço (retenção de audit_log, machine_commands, machine_metrics_history) ou migrar pro plano Pro."

      - uid: orion-supabase-conexoes
        title: Conexões Postgres Perto do Limite
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: orion-api
            model:
              refId: A
              type: json
              source: url
              format: table
              parser: backend
              url: https://orion.bysam.dev/api/monitoring/capacity
              url_options: { method: GET }
              root_selector: ""
              columns:
                - selector: conexoes_pct
                  text: conexoes_pct
                  type: number
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [80] }
              refId: C
        for: 15m
        labels:
          severity: critical
          team: infra
        annotations:
          summary: "Conexões Postgres em {{ $values.A }}% do máximo"
          description: "Saturar o pooler faz o heartbeat começar a receber erro de conexão. Conferir DB_MAX_CONNS (esperado 3) e DB_MIN_CONNS (esperado 0) nas variáveis da Vercel."

      - uid: orion-supabase-storage
        title: Storage Supabase Perto do Limite
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: orion-api
            model:
              refId: A
              type: json
              source: url
              format: table
              parser: backend
              url: https://orion.bysam.dev/api/monitoring/capacity
              url_options: { method: GET }
              root_selector: ""
              columns:
                - selector: storage_pct
                  text: storage_pct
                  type: number
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [80] }
              refId: C
        for: 15m
        labels:
          severity: warning
          team: infra
        annotations:
          summary: "Storage Supabase em {{ $values.A }}% do limite"
          description: "O bucket agent-installers acumula um executável por build. Apagar as versões antigas, mantendo as duas últimas."

      - uid: orion-supabase-realtime-regressao
        title: Tabela Voltou para o Realtime
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: orion-api
            model:
              refId: A
              type: json
              source: url
              format: table
              parser: backend
              url: https://orion.bysam.dev/api/monitoring/capacity
              url_options: { method: GET }
              root_selector: ""
              columns:
                - selector: tabelas_realtime
                  text: tabelas_realtime
                  type: number
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [1] }
              refId: C
        for: 15m
        labels:
          severity: warning
          team: infra
        annotations:
          summary: "A publicação supabase_realtime tem {{ $values.A }} tabelas (esperado: 1, só audit_log)"
          description: "machines foi removida da publicação porque o heartbeat de 500 máquinas geraria 21,6M mensagens/mês contra um teto de 5M até no plano Pro. Se voltou, foi restore de dump antigo, db reset ou clique no painel — remover de novo com: ALTER PUBLICATION supabase_realtime DROP TABLE public.machines;"

      - uid: orion-supabase-egress
        title: Egress Supabase Perto do Limite
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: orion-api
            model:
              refId: A
              type: json
              source: url
              format: table
              parser: backend
              url: https://orion.bysam.dev/api/monitoring/capacity
              url_options: { method: GET }
              root_selector: ""
              columns:
                - selector: egress_pct
                  text: egress_pct
                  type: number
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [80] }
              refId: C
        for: 15m
        labels:
          severity: critical
          team: infra
        annotations:
          summary: "Egress do mês em {{ $values.A }}% do teto (4 GB de 5 GB)"
          description: "Estimado pelos bytes servidos pela API — o número oficial fica no painel de billing do Supabase, e tende a ser um pouco maior porque auth e Storage não passam pelo backend. Ao estourar 5 GB o projeto entra em restrição de uso. Para reduzir agora: aumentar o intervalo de coleta de estação/notebook (collectionIntervalSeconds) e o refetch das telas de monitoramento."
