services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./targets:/etc/prometheus/targets:ro
      - ./rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - '127.0.0.1:9091:9090'
    healthcheck:
      test: ['CMD', 'wget', '-q', '--tries=1', '--spider', 'http://localhost:9090/-/healthy']
      interval: 15s
      timeout: 5s
      retries: 3
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - '3000:3000'
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ALLOW_EMBEDDING=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      # Usado pelo contactPoints.yaml e pelo datasource infinity.yml.
      - GRAFANA_WEBHOOK_SECRET=${GRAFANA_WEBHOOK_SECRET}
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SERVER_DOMAIN=monitor-orion.bysam.dev
      - GF_SERVER_ROOT_URL=https://monitor-orion.bysam.dev
      - GF_USERS_DEFAULT_THEME=dark
      - GF_FEATURE_TOGGLES_ENABLE=lokiLive
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:3000/api/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3
    restart: always

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - '127.0.0.1:8080:8080'
    restart: always

  # ── NODE EXPORTER: Métricas nativas do host Debian ──────────────────
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: always
    pid: host
    ports:
      - "127.0.0.1:9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--no-collector.hwmon'

  blackbox:
    image: prom/blackbox-exporter:latest
    container_name: blackbox
    restart: always
    volumes:
      - ./blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - '--config.file=/etc/blackbox_exporter/config.yml'
    cap_add:
      - NET_RAW

  # ── LOKI: Armazenamento e indexação de logs ──────────────────────────
  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: always
    ports:
      - '127.0.0.1:3100:3100'
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command:
      - '-config.file=/etc/loki/local-config.yaml'
    healthcheck:
      test: ['CMD', '/usr/bin/loki', '-version']
      interval: 15s
      timeout: 5s
      retries: 3

  # ── PROMTAIL: Coletor de logs Docker e do host ───────────────────────
  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: always
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log:/var/log:ro
      - /tmp/promtail:/tmp
    command:
      - '-config.file=/etc/promtail/config.yml'
    depends_on:
      - loki

  bridge:
    build: ./bridge
    container_name: orion-bridge
    restart: always
    # SUPABASE_KEY e BRIDGE_SECRET vêm do .env (fora do repo, de propósito).
    # SUPABASE_KEY é a chave service_role (confirmado em produção em
    # 2026-09-11 pelo log de start de bridge.mjs). Não voltar pra anon key:
    # 20260910190000_revoke_anon_bridge_rpc_grants.sql já revogou o EXECUTE
    # de anon/authenticated nas RPCs de telemetria, então com anon o bridge
    # passa a tomar 403.
    env_file:
      - .env
    volumes:
      - ./targets:/home/samuel/monitoramento/targets
    environment:
      - PROMETHEUS_URL=http://prometheus:9090
      - SUPABASE_URL=https://kcxwealimsfxqstoprdg.supabase.co
      - TARGETS_DIR=/home/samuel/monitoramento/targets
    depends_on:
      - prometheus

  # ── ORION MONITOR: monitoramento de máquinas fora do Supabase ───────
  # Serviço e banco próprios (card "Separar o monitoramento em serviço
  # próprio"). Construído a partir da raiz do repositório, então este
  # compose espera o repositório inteiro clonado no servidor.
  #
  # Porta 9300 (pública pelo Cloudflare Tunnel): só o ingest com segredo e a
  # saúde. Porta 9301 (/metrics): só na rede Docker, para o Prometheus —
  # nunca publicada, porque lista hostname e empresa de todas as máquinas.
  #
  # Variáveis no .env: MONITOR_DB_PASSWORD e MONITOR_INGEST_SECRET. O mesmo
  # MONITOR_INGEST_SECRET vai na Vercel, junto com MONITOR_INGEST_URL.
  monitor-db:
    image: postgres:16-alpine
    container_name: monitor-db
    restart: always
    environment:
      - POSTGRES_DB=orion_monitor
      - POSTGRES_USER=orion_monitor
      - POSTGRES_PASSWORD=${MONITOR_DB_PASSWORD}
    volumes:
      - monitor_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U orion_monitor -d orion_monitor']
      interval: 10s
      timeout: 5s
      retries: 5

  orion-monitor:
    build:
      context: ..
      dockerfile: monitoring/orion-monitor/Dockerfile
    container_name: orion-monitor
    restart: always
    environment:
      - MONITOR_DATABASE_URL=postgres://orion_monitor:${MONITOR_DB_PASSWORD}@monitor-db:5432/orion_monitor?sslmode=disable
      - MONITOR_INGEST_SECRET=${MONITOR_INGEST_SECRET}
      - ORION_CAPACITY_URL=https://orion.bysam.dev/api/monitoring/capacity
      - GRAFANA_WEBHOOK_SECRET=${GRAFANA_WEBHOOK_SECRET}
    ports:
      - '127.0.0.1:9300:9300'
    depends_on:
      monitor-db:
        condition: service_healthy

  # Backup diário do banco do monitor, guardando os 7 mais recentes. O
  # Supabase fazia isso sozinho; aqui é responsabilidade nossa.
  monitor-db-backup:
    image: postgres:16-alpine
    container_name: monitor-db-backup
    restart: always
    environment:
      - PGPASSWORD=${MONITOR_DB_PASSWORD}
    volumes:
      - ./backups/orion-monitor:/backups
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        while true; do
          arquivo=/backups/orion_monitor_$$(date +%Y%m%d_%H%M).sql.gz
          if pg_dump -h monitor-db -U orion_monitor orion_monitor | gzip > "$$arquivo"; then
            echo "backup ok: $$arquivo"
          else
            echo "backup FALHOU"; rm -f "$$arquivo"
          fi
          ls -1t /backups/orion_monitor_*.sql.gz 2>/dev/null | tail -n +8 | xargs -r rm -f
          sleep 86400
        done
    depends_on:
      monitor-db:
        condition: service_healthy

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare-tunnel
    restart: always
    env_file:
      - .env
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    network_mode: host
    command: tunnel --no-autoupdate run

volumes:
  monitor_db_data:
  prometheus_data:
  grafana_data:
  loki_data:
