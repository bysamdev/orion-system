groups:
  - name: orion_recording_rules
    interval: 15s
    rules:
      - record: orion:fleet_cpu:avg
        expr: avg(orion_cpu_usage_percent)
      - record: orion:fleet_ram:avg
        expr: avg(orion_memory_usage_percent)
      - record: orion:fleet_online:count
        expr: count(up == 1) or vector(0)
      - record: orion:fleet_offline:count
        expr: count(up == 0) or vector(0)
      - record: orion:endpoints_online:count
        expr: count(probe_success == 1) or vector(0)
      - record: orion:endpoints_offline:count
        expr: count(probe_success == 0) or vector(0)
      - record: orion:endpoints_uptime:percent
        expr: (avg(probe_success) * 100) or vector(100)
      - record: orion:ssl_cert_days_remaining
        expr: (probe_ssl_earliest_cert_expiry - time()) / 86400

  - name: orion_alert_rules
    interval: 15s
    rules:
      - alert: EndpointDown
        expr: probe_success{job="blackbox_http"} == 0
        for: 1m
        labels:
          severity: critical
          team: infra
        annotations:
          summary: "Endpoint Web Offline: {{ $labels.name }}"
          description: "O endpoint {{ $labels.name }} ({{ $labels.instance }}) não responde a requisições HTTP há mais de 1 minuto."

      - alert: SSLCertExpiringCritical
        expr: orion:ssl_cert_days_remaining < 15
        for: 5m
        labels:
          severity: critical
          team: security
        annotations:
          summary: "Certificado SSL expirando em menos de 15 dias: {{ $labels.name }}"
          description: "O certificado SSL para {{ $labels.instance }} expira em menos de 15 dias. Renove com urgência."

      - alert: SSLCertExpiringWarning
        expr: orion:ssl_cert_days_remaining >= 15 and orion:ssl_cert_days_remaining < 30
        for: 10m
        labels:
          severity: warning
          team: security
        annotations:
          summary: "Certificado SSL expirando em menos de 30 dias: {{ $labels.name }}"
          description: "O certificado SSL para {{ $labels.instance }} expira em menos de 30 dias."

      - alert: HostCpuHigh
        expr: orion_cpu_usage_percent > 90
        for: 5m
        labels:
          severity: warning
          team: infra
        annotations:
          summary: "Uso de CPU elevado no host {{ $labels.hostname }}"
          description: "O uso de CPU está elevado (acima de 90%) há mais de 5 minutos."

      - alert: HostMemoryHigh
        expr: orion_memory_usage_percent > 92
        for: 5m
        labels:
          severity: warning
          team: infra
        annotations:
          summary: "Uso de Memória RAM crítico no host {{ $labels.hostname }}"
          description: "O uso de memória RAM ultrapassou 92% há mais de 5 minutos."

      - alert: HostDiskSpaceLow
        expr: (orion_disk_used_bytes / orion_disk_total_bytes) * 100 > 90
        for: 5m
        labels:
          severity: warning
          team: infra
        annotations:
          summary: "Pouco espaço em disco no host {{ $labels.hostname }}"
          description: "O disco {{ $labels.mount }} ultrapassou 90% de ocupação."

      - alert: AntivirusDisabled
        expr: orion_security_antivirus_status == 0
        for: 3m
        labels:
          severity: critical
          team: security
        annotations:
          summary: "Antivírus desativado ou ausente no host {{ $labels.hostname }}"
          description: "A proteção em tempo real do antivírus está desativada no host {{ $labels.hostname }}."
