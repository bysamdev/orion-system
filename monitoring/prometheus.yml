global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: docker
    static_configs:
      - targets: [cadvisor:8080]

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: node
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          instance: debian-server
          machine_id: e0aee7c0-0458-45b1-b43b-a6258c431486
          hostname: debian-server
          company_id: 61cb93f4-8e93-48f3-860d-c40f510ac55e

  # Orion Monitor: estado atual de todas as máquinas, recebido pelos
  # heartbeats. Substitui o job orion_agents abaixo, que só alcança máquina na
  # rede local do servidor. Porta interna, fora do tunnel.
  - job_name: orion_monitor
    scrape_interval: 60s
    static_configs:
      - targets: [orion-monitor:9301]

  - job_name: orion_agents
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/*agent*.json
        refresh_interval: 15s

  - job_name: blackbox_http
    metrics_path: /probe
    params:
      module: [http_2xx]  # default -- so sobrescrito quando o alvo tem seu proprio label "module" (ver relabel abaixo)
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/web_endpoints.json
        refresh_interval: 15s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      # Sem isto, o label "module" de cada alvo (vindo do web_endpoints.json
      # gerado pelo orion-bridge) era so cosmetico -- o modulo de probe
      # ficava sempre fixo no http_2xx do job inteiro, nunca por-alvo.
      - source_labels: [module]
        target_label: __param_module
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # Ping de fora dos links de internet dos clientes. Os alvos (IP público de
  # cada link, com cliente, nome, papel e tipo como rótulos) vêm do cadastro
  # no Orion Monitor, não mais do Supabase.
  - job_name: blackbox_icmp
    metrics_path: /probe
    scrape_interval: 30s
    params:
      module: [icmp]
    http_sd_configs:
      - url: http://orion-monitor:9301/sd/links
        refresh_interval: 60s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
