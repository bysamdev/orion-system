name: CI

# Achado ORI-P1-04 da auditoria de 2026-09-11: não havia nenhum gate
# automatizado, então regressão, migration inválida e dependência vulnerável
# chegavam direto em produção.
#
# Todo gate aqui foi medido como verde antes de ser ligado — CI que nasce
# vermelha é ruído e as pessoas aprendem a ignorar. A dívida herdada de lint
# (207 erros) entra por catraca, não por gate absoluto.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (typecheck, lint, testes, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Lint (catraca)
        run: node scripts/lint-ratchet.mjs

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build

  api:
    name: API Go (build, vet, testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Formatação
        run: |
          nao_formatados=$(gofmt -l . | grep -v node_modules || true)
          if [ -n "$nao_formatados" ]; then
            echo "✗ Arquivos fora do gofmt:"
            echo "$nao_formatados"
            echo ""
            echo "Rode: gofmt -w <arquivos>"
            exit 1
          fi

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  agent:
    name: Orion Agent (build Windows, testes multiplataforma)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orion-agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: orion-agent/go.mod
          cache-dependency-path: orion-agent/go.sum

      # O agente é um serviço Windows: os pacotes service/ e cmd/installer
      # importam golang.org/x/sys/windows e não compilam em Linux. O
      # cross-compile cobre a compilação de todos eles para o alvo real,
      # incluindo os arquivos _test.go (go vet type-checka os testes também).
      - name: Build cruzado para Windows
        run: GOOS=windows go build ./...

      - name: Vet para Windows
        run: GOOS=windows go vet ./...

      # Execução de teste só para os pacotes que rodam fora do Windows.
      # service/windows_test.go fica sem execução aqui — ver comentário no fim
      # deste arquivo.
      - name: Testes multiplataforma
        run: go test ./collector/... ./config/... ./sender/... ./shortcut/... ./token/... ./tray/...

  agent-windows:
    name: Orion Agent (atalho e ACL no Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: orion-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: orion-agent/go.mod
          cache-dependency-path: orion-agent/go.sum
      - run: go test -count=1 ./shortcut ./token

  migrations:
    name: Migrations (sanidade)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Timestamps duplicados
        run: node scripts/check-migrations.mjs

  # Fecha a lacuna nº 1: sobe o Supabase em container, repete as migrations
  # num banco descartável e roda a suíte pgTAP de supabase/tests (hoje: a
  # regra de avaliação pendente). Medido verde em 18/09/2026, no primeiro
  # run, antes de virar gate.
  banco:
    name: Banco (replay das migrations e pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v3
        with:
          version: 2.84.2

      # Duas migrations históricas têm BOM UTF-8. A CLI 2.84.2 o envia ao
      # Postgres como parte do primeiro comando e o replay falha antes dos
      # testes. Remova-o apenas da cópia descartável do checkout na CI;
      # os arquivos versionados e o histórico de produção permanecem intactos.
      - name: Normalizar BOM no checkout de teste
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for migration in Path('supabase/migrations').glob('*.sql'):
              content = migration.read_bytes()
              if content.startswith(b'\xef\xbb\xbf'):
                  migration.write_bytes(content[3:])
                  print(f'BOM removido do checkout: {migration.name}')
          PY

      # Em 23/09/2026 o ghcr.io (registro que a CLI usa) recusou o download da
      # imagem do Postgres com "toomanyrequests" cinco vezes seguidas, mesmo
      # logado, e a CLI ignora SUPABASE_INTERNAL_IMAGE_REGISTRY. Se a primeira
      # tentativa falhar no download, baixa a mesma imagem do Docker Hub, dá a
      # ela o nome do ghcr.io (a CLI só baixa o que não existe localmente) e
      # tenta de novo. Erro de migration continua falhando o job normalmente.
      - name: Replay das migrations
        run: |
          for rodada in 1 2 3 4; do
            if supabase db start 2>&1 | tee saida.log; [ "${PIPESTATUS[0]}" -eq 0 ]; then
              exit 0
            fi
            grep -o 'ghcr\.io/supabase/[a-z0-9_-]*:[A-Za-z0-9._-]*' saida.log | sort -u > imagens.txt || true
            if [ ! -s imagens.txt ] || [ "$rodada" -eq 4 ]; then
              echo "Falha sem relação com download de imagem, ou ainda falhando na rodada $rodada."
              exit 1
            fi
            while read -r img; do
              espelho="docker.io/${img#ghcr.io/}"
              echo "Baixando $espelho no lugar de $img"
              docker pull "$espelho"
              docker tag "$espelho" "$img"
            done < imagens.txt
            supabase stop --no-backup || true
          done

      - name: Testes pgTAP
        run: supabase test db

  # A imagem do Orion Monitor só é construída no servidor de monitoramento.
  # Sem este job, um Dockerfile quebrado só apareceria na hora do deploy
  # lá. Medido verde em 18/09/2026 antes de virar gate.
  monitor-imagem:
    name: Orion Monitor (imagem Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem
        run: docker build -f monitoring/orion-monitor/Dockerfile -t orion-monitor:ci .

  dependencias:
    name: Dependências (vulnerabilidades de produção)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Só produção: o bundle que vai para o navegador. As vulnerabilidades de
      # devDependency (5 em 2026-09-11, achado ORI-P2-04) são reais mas não
      # expõem o cliente, e gatear nelas travaria todo PR até a atualização do
      # Vitest — que é trabalho próprio, não deste gate.
      - name: npm audit (produção)
        run: npm audit --omit=dev --audit-level=high

# Lacunas conhecidas, deliberadas, a fechar em incrementos próprios:
#
# 1. (Fechada em 18/09/2026 pelo job "banco".) Replay das migrations em banco
#    descartável, com a CLI do Supabase em container.
#
# 2. Testes do serviço em Windows. Atalho e ACL agora rodam no runner
#    windows-latest, mas service/windows_test.go segue só compilado na CI.
#
# 3. Teste cross-tenant de RLS. Depende de (1) mais duas empresas de teste.
